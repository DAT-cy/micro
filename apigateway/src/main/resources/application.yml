server:
  port: 8087

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak chạy ở cổng 8080 (docker-compose). Thay TEN_REALM bằng tên realm thật
          issuer-uri: http://localhost:8080/realms/micro

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://product-service      # = spring.application.name của product-service
              predicates:
                - Path=/v1/products/**

            - id: order-service
              uri: lb://order-service        # = spring.application.name của order-service
              predicates:
                - Path=/v1/orders/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: INFO
