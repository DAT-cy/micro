server:
  port: 8082

spring:
  application:
    name: apigateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/v1/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/v1/orders/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    org.springframework.cloud.gateway: debug